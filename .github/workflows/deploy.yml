name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy (e.g. 1.0.0, 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Deploy container
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $repo = "${{ github.repository }}".ToLower()
          $image = "ghcr.io/$repo"
          docker rm -f lab11-prod 2>$null
          docker run -d --name lab11-prod -p 8012:8000 "${image}:${env:TAG}"